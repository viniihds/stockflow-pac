# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# Local: usa os padroes abaixo (docker/postgres). Producao (Neon): defina as
# variaveis POSTGRES_* e POSTGRES_SSLMODE=require no painel do Render.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockflow}?sslmode=${POSTGRES_SSLMODE:prefer}
spring.datasource.username=${POSTGRES_USER:stockflow}
spring.datasource.password=${POSTGRES_PASSWORD:stockflow}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Render injeta a porta na variavel PORT; localmente cai em SERVER_PORT ou 8080.
server.port=${PORT:${SERVER_PORT:8080}}

# ---------------------------------------------------------------------------
# Seguranca
# ---------------------------------------------------------------------------
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-exp-minutes=${JWT_EXP_MINUTES:60}

# Origens do frontend autorizadas a chamar a API (separadas por virgula, sem "/" no final).
# Em producao, defina CORS_ALLOWED_ORIGINS com a URL da Vercel.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.126:5173}
